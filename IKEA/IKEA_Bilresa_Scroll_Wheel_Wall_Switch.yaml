  var_scroll_ccw_ext_ch1: >-
    {% set ns = namespace(found='') %}
    {% for item in device_entities(var_remote) %}
    {% set match = item | regex_findall(find='^sensor\..+_current_switch_position_2(?:_[0-9]+)?$') %}
    {% if (match | length) > 0 and (ns.found == '' or (match[0] | length) < (ns.found | length)) %}
    {% set ns.found = match[0] %}
    {% endif %}
