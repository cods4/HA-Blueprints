blueprint:
  name: IKEA Bilresa Scroll Wheel + Wall Switch
  author: cods4 (scroll-wheel event handling based on jhol-byte)
  description: |
    Use an IKEA BILRESA scroll wheel (Matter) as a 3-channel remote, plus an
    optional Shelly wall switch in detached / button mode on the same light.

    Version: 1.1.0

    1.1.0 fixes two failures found on HA 2026.11 with instant scrolling:
    the position check compared the sensor state to the strings "1" and
    "1.0" after Home Assistant had already turned that result into the
    number 1, and sensor discovery could select a battery entity whose id
    merely ended in _2. Details are under "Instant scroll" and "Entities".

    Credit: device discovery, relaxed vs instant scrolling, and the
    multi_press count handling follow jhol-byte's "Ikea_bilresa_scroll_wheel"
    (https://gist.github.com/jhol-byte/b2731a4d2476f530d76b9ff409f7f3a4,
    blueprint version 2026-04-06;
    https://community.home-assistant.io/t/ikea-bilresa-scroll-wheel-blueprint-matter-the-original/965365).
    Wall-switch inputs follow IKEA_Bilresa_Dual_Button_Wall_Switch.yaml in this
    repository.

    Written for Home Assistant 2026.10 Matter event entities (checked against
    core tag 2026.10.4). The integration does not emit multi_press_ongoing or
    initial_press for this remote; see the notes at the bottom before changing
    event names.

    Setup:
    1. Pair the remote with the Matter integration. Choose that device as Remote.
       The device filter looks for manufacturer "IKEA of Sweden" and model
       "BILRESA scroll wheel".
    2. Choose the light. Use a light-group helper to control more than one bulb.
    3. Channel 3 defaults to a media player. Pick the player, or set Channel 3
       mode to Custom and fill in the actions.
    4. Wall switch is optional. Leave "Wall switch event entities" empty to use
       the remote only. On the Shelly, set the input to Button (Gen2+) or
       Momentary / Detached (Gen1) and the output to Detached, then select the
       event entity (for example event.lounge_lounge_lights_input_1).

    The physical channel control (the end of the remote with the LEDs) stays on
    the device. The Matter fixture has no endpoint for it. Home Assistant only
    sees the wheel and the centre button for whichever channel is selected.

    Entities are found from the device. Home Assistant templates cannot read
    an entity's unique_id, so this cannot match the Matter endpoint number
    inside the registry id. It matches the English object-id HA generates:
    event.<slug>_button_<N> and sensor.<slug>_current_switch_position_<N>.
    A duplicate suffix is allowed (current_switch_position_2_2 still matches
    channel 1 counter-clockwise). Do not rename those fragments away.
    battery_2 is not a position sensor and is ignored.

    Scroll evaluation:
    - Relaxed (default): when a gesture ends, Matter sends one event whose
      count is the number of detents (1 to 8). One light or volume change is
      applied, scaled by that count. Nothing extra to enable.
    - Instant: one step each time that direction's "Current switch position"
      sensor changes to 1. Those sensors are diagnostic and created disabled
      (entity_registry_enabled_default is false). Enable positions 1, 2, 4, 5,
      7 and 8. Instant mode follows spins longer than 8 detents. Shorten the
      transition if the queue starts to lag behind the wheel.
      The comparison is numeric (float == 1). A rendered "1" is stored as
      the number 1, so a test against the strings "1" or "1.0" never matches.
      The same parser leaves multi_press_1, clockwise, and ch1 as text,
      because those are not Python literals. Counts and 0/1 flags are already
      compared as numbers.

    Channels (clockwise is brighter / higher hue / cooler white / louder):
    - Channel 1: centre button single press toggles the light. The wheel
      changes brightness by the step size. Dimming stops at the minimum and
      does not turn the light off. Double, triple and long press are optional
      actions (empty does nothing).
    - Channel 2: the wheel changes hue on a colour-capable light, or colour
      temperature on a CT-only light. The mode input can force either. The
      centre button does nothing until you add an action.
    - Channel 3, Media: wheel changes volume, single press is play/pause.
      Channel 3, Custom: the wheel and the button run the actions you supply.
      A scroll action can use scroll_clicks (integer, 1 in instant mode) and
      scroll_direction ("clockwise" or "counter_clockwise").

    Wall switch, when an event entity is selected. Check the entity's
    event_types list in Developer Tools; the blueprint can only react to
    types that entity actually emits.
    - Single press (single, single_push, or S) toggles the light. Any selected
      light on means all off, otherwise all on.
    - Double press turns the light on at the warm-white colour temperature
      (default 2700 K). The light must support colour temperature. This needs
      a double event type: Gen2+ emits double_push; some Gen1 devices emit
      double. A Shelly Gen1 event entity whose event_types are only
      single and long has no double and no btn_up, so a second click is another
      toggle and warm white never runs. Use a Gen2+ Shelly, or add whatever
      double type your device really emits, to get warm white.
    - Hold dims, and never turns the light off. Gen2+ long_push starts the
      ramp (not btn_down: that also fires for a normal click). The ramp
      repeats while event_type stays long_push; btn_up replaces it on release
      and the ramp stops. Gen1 long has no btn_up. On a single/long-only
      Gen1 entity, hold is one brightness step unless you set a hold
      binary_sensor that stays on while the switch is held.
    - Auto direction brightens until the light is at or above the reverse point
      (default 90%), and the next hold dims. Up and Down force the direction.

    Mode is queued (same idea as jhol-byte's blueprint) with a cap, default 10,
    and max_exceeded silent. Each wheel event is a short run, so fast scrolling
    keeps its steps in order instead of restart cancelling them or single
    dropping them. Past the cap, extra runs are dropped rather than flooding
    the log. A wall-hold ramp occupies the running slot until release (30 s
    safety cap); wheel events from that window wait in the queue and run
    afterwards. Restart is not used: a btn_up or a wheel event would cancel
    the ramp before it finished, which is the same reason the dual-button
    blueprint stays on single during a hold.

    Verify on the real remote if you can:
    - Clockwise is button _1 / _4 / _7. That is the Matter "Up" tag on those
      endpoints, and HA core issue 159035 calls the same endpoints clockwise.
      If the wheel feels backwards, the tags and that issue disagree with how
      the remote is held.
    - Shelly long_push remains the event_type until btn_up. If a firmware emits
      long_push only as a one-shot at release, a hold becomes a single step.
    - Instant mode assumes the position sensor reaches state 1 once per detent
      (jhol-byte's blueprint does the same).

    Event map (HA 2026.10.4, fixture tests/components/matter/fixtures/nodes/ikea_scroll_wheel.json):
    - Endpoints 1, 4, 7: rotary, Switch tag Up (0x43/0x03), custom label
      "rotary", column label 1/2/3. MultiPressMax 18, FeatureMap 22
      (momentary + release + multi-press). HA event_types are only
      multi_press_1 .. multi_press_8 because event.py caps the count at 8 and
      drops anything above that. Counts that do get through are also on the
      attribute totalNumberOfPressesCounted.
    - Endpoints 2, 5, 8: rotary, Switch tag Down (0x43/0x04). Same event_types.
    - Endpoints 3, 6, 9: custom label "button", tags Toggle, Next, Previous.
      MultiPressMax 3, FeatureMap 30 (also long-press). event_types:
      multi_press_1, multi_press_2, multi_press_3, long_press, long_release.
    - multi_press_ongoing is intentionally ignored by the integration for
      multi-press switches, so per-detent wheel events are the position
      sensors, not Matter events.
  source_url: https://github.com/cods4/HA-Blueprints/blob/main/IKEA/IKEA_Bilresa_Scroll_Wheel_Wall_Switch.yaml
  domain: automation
  input:
    remote:
      name: Remote
      description: >
        IKEA BILRESA scroll wheel paired directly to Home Assistant over Matter.
        The 9 button event entities are discovered from this device.
      selector:
        device:
          filter:
            - manufacturer: IKEA of Sweden
              model: BILRESA scroll wheel
              integration: matter
    light_entity:
      name: Light
      description: >
        Light controlled by channel 1 (toggle and brightness), channel 2
        (colour) and the wall switch. Use a light-group helper for several bulbs.
      selector:
        entity:
          domain: light
    scroll_evaluation:
      name: Scroll evaluation
      description: >
        Relaxed: one change when the gesture ends, scaled by how many detents
        Matter reported (1–8). Instant: one step per detent from the position
        sensors, which must be enabled. Instant tracks spins longer than 8 detents.
      default: relaxed
      selector:
        select:
          options:
            - label: Relaxed (after the gesture, uses the event count)
              value: relaxed
            - label: Instant (per detent, enable the position sensors)
              value: instant
    max_queued:
      name: Max queued runs
      description: >
        How many wheel or wall runs may wait while one is still going. Extra
        triggers are dropped quietly. Raise it if instant scrolling lags on a
        slow light; lower it if a backlog after a long wall hold is too large.
      default: 10
      selector:
        number:
          min: 2
          max: 50
          step: 1
          mode: box
    channel_1:
      name: Channel 1 — toggle and brightness
      description: >
        Centre button single press toggles the light. Clockwise scroll
        brightens, counter-clockwise dims. Double, triple and long press do
        nothing unless an action is set below.
      collapsed: true
      input:
        brightness_step_pct:
          name: Brightness step
          description: >
            Brightness change per detent. Relaxed mode multiplies this by the
            detent count (a 4-detent flick at 5% is 20%). Default 5%.
          default: 5
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
        brightness_transition:
          name: Brightness transition
          description: >
            How long each brightness change takes. The light needs transition
            support. Use about 0.3 s for relaxed mode. For instant mode, 0.1 s
            keeps the queue from lagging behind the wheel.
          default: 0.3
          selector:
            number:
              min: 0
              max: 1.5
              step: 0.1
              unit_of_measurement: s
        brightness_min_pct:
          name: Minimum brightness
          description: >
            Dimming stops here and leaves the light on. The wall-switch ramp
            uses the same floor. Default 5%.
          default: 5
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
        dim_turns_on:
          name: Brightness scroll can turn the light on
          description: >
            Clockwise scroll turns the light on when it is off. Counter-clockwise
            does nothing while the light is off.
          default: true
          selector:
            boolean: {}
        ch1_double_action:
          name: Channel 1 double press (optional)
          description: Runs on multi_press_2. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch1_triple_action:
          name: Channel 1 triple press (optional)
          description: Runs on multi_press_3. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch1_long_action:
          name: Channel 1 long press (optional)
          description: Runs on long_press. Leave empty to do nothing.
          default: []
          selector:
            action: {}
    channel_2:
      name: Channel 2 — colour
      description: >
        The wheel changes colour on the same light. Auto uses hue when the
        light supports colour, and colour temperature otherwise. The centre
        button is optional.
      collapsed: true
      input:
        ch2_color_mode:
          name: Colour mode
          description: >
            Auto: hue if the light reports hs, xy, rgb, rgbw or rgbww;
            otherwise colour temperature. Hue and Colour temperature force
            that mode. A forced hue on a CT-only light falls back to colour
            temperature when the light supports it.
          default: auto
          selector:
            select:
              options:
                - label: Auto (hue, or colour temperature if that is all the light can do)
                  value: auto
                - label: Hue
                  value: hue
                - label: Colour temperature
                  value: color_temp
        hue_step:
          name: Hue step
          description: >
            Degrees of hue per detent (0–360, wrapping). Relaxed mode multiplies
            by the detent count. Existing saturation is kept; the saturation
            below is only used when the light has no hs colour yet.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: "°"
        color_saturation:
          name: Saturation when the light has no colour yet
          description: Used the first time hue is set and the light has no hs_color. Default 100%.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
        ct_min:
          name: Minimum colour temperature
          description: Lower kelvin is warmer. The light may clamp this to its own range.
          default: 2200
          selector:
            number:
              min: 1000
              max: 4000
              step: 50
              unit_of_measurement: K
              mode: box
        ct_max:
          name: Maximum colour temperature
          description: Higher kelvin is cooler.
          default: 6500
          selector:
            number:
              min: 2700
              max: 10000
              step: 50
              unit_of_measurement: K
              mode: box
        ct_step:
          name: Colour temperature step
          description: >
            Kelvin per detent. Clockwise raises kelvin (cooler). Relaxed mode
            multiplies by the detent count.
          default: 150
          selector:
            number:
              min: 10
              max: 500
              step: 10
              unit_of_measurement: K
              mode: box
        color_turns_on:
          name: Colour scroll can turn the light on
          description: Scrolling the wheel turns the light on when it is off.
          default: true
          selector:
            boolean: {}
        ch2_click_action:
          name: Channel 2 single press (optional)
          description: Runs on multi_press_1. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch2_double_action:
          name: Channel 2 double press (optional)
          description: Runs on multi_press_2. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch2_triple_action:
          name: Channel 2 triple press (optional)
          description: Runs on multi_press_3. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch2_long_action:
          name: Channel 2 long press (optional)
          description: Runs on long_press. Leave empty to do nothing.
          default: []
          selector:
            action: {}
    channel_3:
      name: Channel 3 — media or custom
      description: >
        Media: wheel changes volume, single press is play/pause. Custom: the
        actions below run instead, so the channel can do something else.
        Double, triple and long press run their actions in either mode when
        you set them.
      collapsed: true
      input:
        ch3_mode:
          name: Channel 3 mode
          default: media
          selector:
            select:
              options:
                - label: Media player (volume and play/pause)
                  value: media
                - label: Custom actions
                  value: custom
        media_players:
          name: Media players
          description: >
            Used when the mode is Media. One player is enough; every selected
            player is adjusted together.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        volume_step_pct:
          name: Volume step
          description: >
            Volume change per detent, in percent. Relaxed mode multiplies by
            the detent count. Default 4%.
          default: 4
          selector:
            number:
              min: 1
              max: 20
              step: 0.5
              unit_of_measurement: "%"
        volume_max_pct:
          name: Maximum volume
          description: The wheel will not set a volume above this. Default 100%.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
        volume_up_down_when_instant:
          name: Instant mode uses volume up/down
          description: >
            In instant mode, call media_player.volume_up and volume_down
            (one step per detent) instead of setting an absolute level. Turn
            this off if those steps are too coarse, and use Volume step.
          default: true
          selector:
            boolean: {}
        ch3_click_action:
          name: Channel 3 single press (custom mode)
          description: >
            Used when Channel 3 mode is Custom. In Media mode a single press
            is play/pause and this action is not used.
          default: []
          selector:
            action: {}
        ch3_double_action:
          name: Channel 3 double press (optional)
          description: >
            Runs on multi_press_2 in Media and Custom mode. A typical Media
            action is media_player.media_next_track. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch3_triple_action:
          name: Channel 3 triple press (optional)
          description: >
            Runs on multi_press_3 in either mode. A typical Media action is
            media_player.media_previous_track. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch3_long_action:
          name: Channel 3 long press (optional)
          description: Runs on long_press in either mode. Leave empty to do nothing.
          default: []
          selector:
            action: {}
        ch3_scroll_action:
          name: Channel 3 scroll (custom mode)
          description: >
            Used when Channel 3 mode is Custom. Variables you can use:
            scroll_clicks (integer; always 1 in instant mode, otherwise the
            detent count) and scroll_direction ("clockwise" or
            "counter_clockwise").
          default: []
          selector:
            action: {}
    wall_switch:
      name: Wall switch (optional)
      description: >
        Shelly (or similar) event entity for a detached button. Leave the event
        list empty for remote-only. Single press toggles, double press sets
        warm white, hold dims. Do not also select btn_down as a toggle type or
        one click will toggle twice.
      collapsed: true
      input:
        wall_switch_lights:
          name: Wall switch lights (optional)
          description: >
            Lights the wall switch controls as a group. Leave empty to use Light.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        wall_switch_events:
          name: Wall switch event entities
          description: >
            For example event.lounge_lounge_lights_input_1. Any number. Empty
            disables the wall switch.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: event
        wall_toggle_types:
          name: Event types that toggle
          description: >
            Gen1 event entities use "single"; Gen2+ use "single_push"; a Shelly
            Button1 shelly.click payload uses "S". btn_down is listed so it can
            be seen, and is not selected: it fires on every press, including
            double-clicks and holds.
          default:
            - single
            - single_push
            - S
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - single
                - single_push
                - btn_down
                - btn_up
                - double
                - double_push
                - S
        wall_double_types:
          name: Event types that set warm white
          description: >
            Turns the light on at Warm white if it is off. Gen2+ emits
            double_push. A Gen1 entity that only lists single and long never
            emits these, so warm white does not run on that switch. Add a type
            here only if it appears in the entity's event_types.
          default:
            - double
            - double_push
            - SS
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - double
                - double_push
                - SS
                - triple
                - triple_push
        wall_dim_types:
          name: Event types that start dimming
          description: >
            Gen2+ "long_push" ramps while held. Gen1 "long" and Button1 "L" are
            a single step, unless a hold sensor below is on.
          default:
            - long
            - long_push
            - L
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - long
                - long_push
                - L
        wall_held_types:
          name: Event types that mean "still held"
          description: >
            The ramp repeats while event_type is one of these. Gen2+ keeps
            long_push until btn_up. Do not add "long" or "btn_down": "long"
            never changes to a release event, and btn_down is only the start
            of a click.
          default:
            - long_push
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - long_push
        wall_dim_direction:
          name: Hold direction
          description: >
            Auto brightens until the light reaches the reverse point, then the
            next hold dims. The ramp turns the light on when brightening from off.
          default: auto
          selector:
            select:
              options:
                - label: Auto (up until the reverse point, then down)
                  value: auto
                - label: Always brighter
                  value: up
                - label: Always dimmer
                  value: down
        wall_dim_reverse_above:
          name: Auto reverse above
          description: >
            In Auto, a hold dims instead of brightening when the light is
            already at or above this percent. Default 90%.
          default: 90
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
        wall_dim_step:
          name: Hold ramp step
          description: >
            Brightness change per tick while the button is held. Together with
            the interval this is the ramp speed. Default 8% every 0.2 s.
          default: 8
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: "%"
        wall_dim_interval:
          name: Hold ramp interval
          description: >
            Time between ramp ticks, and the transition of each tick. The ramp
            also stops after 30 s if no release is seen.
          default: 0.2
          selector:
            number:
              min: 0.05
              max: 1
              step: 0.05
              unit_of_measurement: s
        wall_long_step:
          name: One-shot dim step
          description: >
            Gen1 "long" / "L" when no hold sensor is on. A Shelly that only
            emits single and long cannot ramp, because nothing marks the
            release. This one step is what a hold does then. Default 20%.
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
        wall_hold_sensors:
          name: Hold sensors (optional)
          description: >
            binary_sensor that is on while the switch is physically held.
            Required for a smooth ramp on Gen1 (event types single and long
            only): there is no btn_up to end a ramp. When one of these is on
            as the long event arrives, the ramp follows the sensor. Leave
            empty on Gen2+ if long_push stays set until btn_up. Confirm the
            sensor tracks the hold before relying on it.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        warm_white_kelvin:
          name: Warm white colour temperature
          description: >
            Double press turns the light on at this colour temperature.
            Default 2700 K. Ignored by bulbs with no colour-temperature mode
            (the service call will fail for those).
          default: 2700
          selector:
            number:
              min: 2000
              max: 6500
              step: 50
              unit_of_measurement: K
              mode: box

variables:
  light_entity: !input light_entity
  scroll_evaluation: !input scroll_evaluation
  brightness_step_pct: !input brightness_step_pct
  brightness_transition: !input brightness_transition
  brightness_min_pct: !input brightness_min_pct
  dim_turns_on: !input dim_turns_on
  ch2_color_mode: !input ch2_color_mode
  hue_step: !input hue_step
  color_saturation: !input color_saturation
  ct_min: !input ct_min
  ct_max: !input ct_max
  ct_step: !input ct_step
  color_turns_on: !input color_turns_on
  ch1_double_action: !input ch1_double_action
  ch1_triple_action: !input ch1_triple_action
  ch1_long_action: !input ch1_long_action
  ch2_click_action: !input ch2_click_action
  ch2_double_action: !input ch2_double_action
  ch2_triple_action: !input ch2_triple_action
  ch2_long_action: !input ch2_long_action
  ch3_mode: !input ch3_mode
  media_players: !input media_players
  volume_step_pct: !input volume_step_pct
  volume_max_pct: !input volume_max_pct
  volume_up_down_when_instant: !input volume_up_down_when_instant
  ch3_click_action: !input ch3_click_action
  ch3_double_action: !input ch3_double_action
  ch3_triple_action: !input ch3_triple_action
  ch3_long_action: !input ch3_long_action
  ch3_scroll_action: !input ch3_scroll_action
  wall_switch_lights_input: !input wall_switch_lights
  wall_toggle_types: !input wall_toggle_types
  wall_double_types: !input wall_double_types
  wall_dim_types: !input wall_dim_types
  wall_held_types: !input wall_held_types
  wall_dim_direction: !input wall_dim_direction
  wall_dim_reverse_above: !input wall_dim_reverse_above
  wall_dim_step: !input wall_dim_step
  wall_dim_interval: !input wall_dim_interval
  wall_long_step: !input wall_long_step
  wall_hold: !input wall_hold_sensors
  warm_white_kelvin: !input warm_white_kelvin
  # Comma-separated ids. Empty wall light list falls back to the main light.
  wall_target: >-
    {% set l = wall_switch_lights_input %}
    {% if l is string %}{% set l = [l] if l else [] %}{% endif %}
    {% if l | length == 0 %}{% set l = [light_entity] %}{% endif %}
    {{- l | join(', ') -}}
  wall_ref: "{{ wall_target.split(', ')[0] }}"
  min_brightness: "{{ [1, (brightness_min_pct / 100 * 255) | round(0) | int] | max }}"

# device_entities() returns entity ids only. Templates cannot read unique_id,
# so the Matter endpoint buried in it is not available here. Match the object
# id HA builds from the English name: button_<N> and current_switch_position_<N>,
# plus an optional _<digits> duplicate suffix. Shortest match wins, which keeps
# button_2 ahead of button_2_2 and ignores battery_2.
trigger_variables:
  var_remote: !input remote
  var_button_ch1: >-
    {% set ns = namespace(found='') %}
    {% for item in device_entities(var_remote) %}
    {% set match = item | regex_findall(find='^event\..+_button_3(?:_[0-9]+)?$') %}
    {% if (match | length) > 0 and (ns.found == '' or (match[0] | length) < (ns.found | length)) %}
    {% set ns.found = match[0] %}
    {% endif %}
    {% endfor %}
    {{ ns.found if ns.found != '' else 'event.bilresa_scroll_wheel_unconfigured_3' }}
  var_scroll_ccw_ch1: >-
    {% set ns = namespace(found='') %}
    {% for item in device_entities(var_remote) %}
    {% set match = item | regex_findall(find='^event\..+_button_2(?:_[0-9]+)?$') %}
    {% if (match | length) > 0 and (ns.found == '' or (match[0] | length) < (ns.found | length)) %}
    {% set ns.found = match[0] %}
    {% endif %}
    {% endfor %}
    {{ ns.found if ns.found != '' else 'event.bilresa_scroll_wheel_unconfigured_2' }}
  var_scroll_cw_ch1: >-
    {% set ns = namespace(found='') %}
    {% for item in device_entities(var_remote) %}
