triggers:
  # Event triggers (not state triggers) because the entity ids are templates.
  # state_changed still fires when the event timestamp changes, including a
  # repeated multi_press_1. Filtering on the event_type attribute alone would
  # miss that second press.
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch1 }}"
    id: button_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_cw_ch1 }}"
    id: scroll_cw_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_ccw_ch1 }}"
    id: scroll_ccw_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_cw_ext_ch1 }}"
    id: scroll_cw_ext_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_ccw_ext_ch1 }}"
    id: scroll_ccw_ext_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch2 }}"
    id: button_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_cw_ch2 }}"
    id: scroll_cw_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_ccw_ch2 }}"
    id: scroll_ccw_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_cw_ext_ch2 }}"
    id: scroll_cw_ext_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_ccw_ext_ch2 }}"
    id: scroll_ccw_ext_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch3 }}"
    id: button_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_cw_ch3 }}"
    id: scroll_cw_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_ccw_ch3 }}"
    id: scroll_ccw_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_cw_ext_ch3 }}"
    id: scroll_cw_ext_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_ccw_ext_ch3 }}"
    id: scroll_ccw_ext_ch3
  # Empty list is a no-op, so remote-only automations still load.
  - trigger: state
    entity_id: !input wall_switch_events
    id: wall
    not_from: unavailable
    not_to: unavailable

conditions:
  - condition: template
    value_template: >-
      {% if trigger.platform == 'state' %}
        {% set old = trigger.from_state %}
        {% set new = trigger.to_state %}
      {% else %}
        {% set old = trigger.event.data.old_state %}
        {% set new = trigger.event.data.new_state %}
      {% endif %}
      {% set tid = trigger.id | default('') %}
      {% if new is none or new.state in ['unavailable', 'unknown'] %}
        {{ false }}
      {% elif old is not none and old.state == 'unavailable' %}
        {{ false }}
      {% elif '_ext_' in tid %}
        {# State is text here. float still accepts "1", "1.0", 1 and 1.0. #}
        {{ scroll_evaluation == 'instant' and (new.state | float(-1)) == 1 }}
      {% elif tid.startswith('scroll_') %}
        {{ scroll_evaluation == 'relaxed' }}
      {% else %}
        {{ true }}
      {% endif %}

mode: queued
max: !input max_queued
max_exceeded: silent

actions:
  - variables:
      event_type: >-
        {% if trigger.platform == 'state' %}
          {{- trigger.to_state.attributes.event_type | default('') | trim -}}
        {% else %}
          {{- trigger.event.data.new_state.attributes.event_type | default('') | trim -}}
        {% endif %}
      to_state_value: >-
        {% if trigger.platform == 'state' %}
          {{- trigger.to_state.state | trim -}}
        {% else %}
          {{- trigger.event.data.new_state.state | trim -}}
        {% endif %}
  - choose:
      # Channel 1 single press: toggle
      - conditions:
          - condition: trigger
            id: button_ch1
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_entity

      - conditions:
          - condition: trigger
            id: button_ch1
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' and ch1_double_action | length > 0 }}"
        sequence: !input ch1_double_action

      - conditions:
          - condition: trigger
            id: button_ch1
          - condition: template
            value_template: "{{ event_type == 'multi_press_3' and ch1_triple_action | length > 0 }}"
        sequence: !input ch1_triple_action

      - conditions:
          - condition: trigger
            id: button_ch1
          - condition: template
            value_template: "{{ event_type == 'long_press' and ch1_long_action | length > 0 }}"
        sequence: !input ch1_long_action

      # Channel 2 centre button
      - conditions:
          - condition: trigger
            id: button_ch2
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' and ch2_click_action | length > 0 }}"
        sequence: !input ch2_click_action

      - conditions:
          - condition: trigger
            id: button_ch2
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' and ch2_double_action | length > 0 }}"
        sequence: !input ch2_double_action

      - conditions:
          - condition: trigger
            id: button_ch2
          - condition: template
            value_template: "{{ event_type == 'multi_press_3' and ch2_triple_action | length > 0 }}"
        sequence: !input ch2_triple_action

      - conditions:
          - condition: trigger
            id: button_ch2
          - condition: template
            value_template: "{{ event_type == 'long_press' and ch2_long_action | length > 0 }}"
        sequence: !input ch2_long_action

      # Channel 3 centre button
      - conditions:
          - condition: trigger
            id: button_ch3
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' and ch3_mode == 'media' and media_players | length > 0 }}"
        sequence:
          - action: media_player.media_play_pause
            target:
              entity_id: >-
                {{ media_players if media_players is string else media_players | join(', ') }}

      - conditions:
          - condition: trigger
            id: button_ch3
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' and ch3_mode == 'custom' and ch3_click_action | length > 0 }}"
        sequence: !input ch3_click_action

      - conditions:
          - condition: trigger
            id: button_ch3
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' and ch3_double_action | length > 0 }}"
        sequence: !input ch3_double_action

      - conditions:
          - condition: trigger
            id: button_ch3
          - condition: template
            value_template: "{{ event_type == 'multi_press_3' and ch3_triple_action | length > 0 }}"
        sequence: !input ch3_triple_action

      - conditions:
          - condition: trigger
            id: button_ch3
          - condition: template
            value_template: "{{ event_type == 'long_press' and ch3_long_action | length > 0 }}"
        sequence: !input ch3_long_action

      # Wheel, any channel. Relaxed uses the event entities; instant uses position sensors.
      - conditions:
          - condition: template
            value_template: >-
              {% set tid = trigger.id | default('') %}
              {% set relaxed_ids = [
                'scroll_cw_ch1', 'scroll_ccw_ch1',
                'scroll_cw_ch2', 'scroll_ccw_ch2',
                'scroll_cw_ch3', 'scroll_ccw_ch3'
              ] %}
              {% set instant_ids = [
                'scroll_cw_ext_ch1', 'scroll_ccw_ext_ch1',
                'scroll_cw_ext_ch2', 'scroll_ccw_ext_ch2',
                'scroll_cw_ext_ch3', 'scroll_ccw_ext_ch3'
              ] %}
              {# to_state_value is re-parsed by HA. A rendered "1" becomes int 1,
                 so a string membership test is never true. Compare as a number.
                 float("1.0") works; int("1.0") does not. #}
              {{ (scroll_evaluation == 'relaxed' and tid in relaxed_ids and event_type is string and event_type.startswith('multi_press_'))
                 or (scroll_evaluation == 'instant' and tid in instant_ids and (to_state_value | float(-1)) == 1) }}
        sequence:
          - variables:
              scroll_channel: "{{ 'ch1' if '_ch1' in trigger.id else ('ch2' if '_ch2' in trigger.id else 'ch3') }}"
              scroll_direction: "{{ 'clockwise' if 'scroll_cw_' in trigger.id else 'counter_clockwise' }}"
              scroll_sign: "{{ 1 if scroll_direction == 'clockwise' else -1 }}"
              scroll_clicks: >-
                {% set raw = trigger.event.data.new_state.attributes.totalNumberOfPressesCounted | default(0) | int(0) if scroll_evaluation == 'relaxed' else 0 %}
                {% set parsed = event_type.split('_')[-1] | int(1) %}
                {{- (raw if raw > 0 else parsed) if scroll_evaluation == 'relaxed' else 1 -}}
          - choose:
              # Channel 1 brightness
              - conditions:
                  - condition: template
                    value_template: "{{ scroll_channel == 'ch1' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ is_state(light_entity, 'on') }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_step_pct: >-
                                {% set bri = state_attr(light_entity, 'brightness') | int(0) %}
                                {% set pct = bri / 255 * 100 %}
                                {% set raw = (scroll_clicks | int) * (brightness_step_pct | float) %}
                                {% if scroll_sign | int == 1 %}
                                  {{ raw }}
                                {% else %}
                                  {% set room = [pct - (brightness_min_pct | float), 0] | max %}
                                  {{ -([raw, room] | min) }}
                                {% endif %}
                              transition: "{{ brightness_transition }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ scroll_sign | int == 1 and dim_turns_on | bool }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: >-
                                {{ [brightness_min_pct | float, (scroll_clicks | int) * (brightness_step_pct | float)] | max }}
                              transition: "{{ brightness_transition }}"

              # Channel 2 colour
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ scroll_channel == 'ch2'
                         and (is_state(light_entity, 'on') or color_turns_on | bool) }}
                sequence:
                  - variables:
                      supported_modes: "{{ state_attr(light_entity, 'supported_color_modes') or [] }}"
                      hue_capable: "{{ 1 if (supported_modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | length > 0) else 0 }}"
                      ct_capable: "{{ 1 if 'color_temp' in supported_modes else 0 }}"
                      use_hue: >-
                        {{- 0 if ch2_color_mode == 'color_temp' else (1 if hue_capable | int == 1 else 0) -}}
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ use_hue | int == 1 }}"
                        sequence:
                          - variables:
                              new_hue: >-
                                {% set hs = state_attr(light_entity, 'hs_color') %}
                                {% set hue = hs[0] | float(0) if hs else 0 %}
                                {{ (hue + (scroll_sign | int) * (scroll_clicks | int) * (hue_step | float)) % 360 }}
                              new_sat: >-
                                {% set hs = state_attr(light_entity, 'hs_color') %}
                                {{ hs[1] | float(color_saturation) if hs else color_saturation }}
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              hs_color:
                                - "{{ new_hue }}"
                                - "{{ new_sat }}"
                              transition: "{{ brightness_transition }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ ct_capable | int == 1 }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              color_temp_kelvin: >-
                                {% set cur = state_attr(light_entity, 'color_temp_kelvin') %}
                                {% if cur is none or cur | float(0) == 0 %}
                                  {% set cur = [ct_min | float, [ct_max | float, 2700] | min] | max %}
                                {% endif %}
                                {% set new = (cur | float) + (scroll_sign | int) * (scroll_clicks | int) * (ct_step | float) %}
                                {{ [ct_min | float, [ct_max | float, new] | min] | max | round(0) | int }}
                              transition: "{{ brightness_transition }}"

              # Channel 3 media volume
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ scroll_channel == 'ch3' and ch3_mode == 'media' and media_players | length > 0 }}
                sequence:
                  - repeat:
                      for_each: "{{ [media_players] if media_players is string else media_players }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ scroll_evaluation == 'instant'
                                       and volume_up_down_when_instant | bool
                                       and not is_state(repeat.item, 'unavailable') }}
                              sequence:
                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ scroll_direction == 'counter_clockwise' }}"
                                      sequence:
                                        - action: media_player.volume_down
                                          target:
                                            entity_id: "{{ repeat.item }}"
                                    - conditions:
                                        - condition: template
                                          value_template: >-
                                            {% set lvl = state_attr(repeat.item, 'volume_level') %}
                                            {{ lvl is none or (lvl | float(0) * 100) < (volume_max_pct | float) }}
                                      sequence:
                                        - action: media_player.volume_up
                                          target:
                                            entity_id: "{{ repeat.item }}"
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ not is_state(repeat.item, 'unavailable')
                                       and state_attr(repeat.item, 'volume_level') is not none }}
                              sequence:
                                - action: media_player.volume_set
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    volume_level: >-
                                      {% set cur = state_attr(repeat.item, 'volume_level') | float(0) %}
                                      {% set delta = (scroll_clicks | int) * (volume_step_pct | float) / 100 * (scroll_sign | int) %}
                                      {{ [[cur + delta, (volume_max_pct | float) / 100] | min, 0] | max }}

              # Channel 3 custom scroll. scroll_clicks and scroll_direction are in scope.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ scroll_channel == 'ch3' and ch3_mode == 'custom' and ch3_scroll_action | length > 0 }}
                sequence: !input ch3_scroll_action

      # Wall single press: group toggle
      - conditions:
          - condition: trigger
            id: wall
          - condition: template
            value_template: "{{ event_type in wall_toggle_types }}"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set ns = namespace(on=false) %}
                  {% for e in wall_target.split(', ') %}
                    {% if is_state(e, 'on') %}{% set ns.on = true %}{% endif %}
                  {% endfor %}
                  {{ ns.on }}
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ wall_target }}"
            else:
              - action: light.turn_on
                target:
                  entity_id: "{{ wall_target }}"

      # Wall double press: warm white, on if it was off
      - conditions:
          - condition: trigger
            id: wall
          - condition: template
            value_template: "{{ event_type in wall_double_types }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ wall_target }}"
            data:
              color_temp_kelvin: "{{ warm_white_kelvin | int }}"
              transition: "{{ brightness_transition }}"

      # Wall hold / long press
      - conditions:
          - condition: trigger
            id: wall
          - condition: template
            value_template: "{{ event_type in wall_dim_types }}"
        sequence:
          - variables:
              held_entity: "{{ trigger.entity_id }}"
              start_bri: "{{ state_attr(wall_ref, 'brightness') | int(0) if is_state(wall_ref, 'on') else 0 }}"
              going_up: "{{ 0 if wall_dim_direction == 'down' else (1 if wall_dim_direction == 'up' else (1 if (start_bri | int(0)) < ((wall_dim_reverse_above | float(90)) / 100 * 255) else 0)) }}"
              hold_sensors_on: >-
                {% set holds = [wall_hold] if wall_hold is string else wall_hold %}
                {{- 1 if holds | select('is_state', 'on') | list | length > 0 else 0 -}}
              ramp_mode: "{{ 'sensor' if hold_sensors_on | int(0) == 1 else ('event' if event_type in wall_held_types else 'step') }}"
              ramp_level: "{{ start_bri | int(0) }}"
          - choose:
              # Gen1 long, or a long_push that is not a "still held" type: one step.
              - conditions:
                  - condition: template
                    value_template: "{{ ramp_mode == 'step' and not (going_up | int == 0 and is_state(wall_ref, 'off')) }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ wall_target }}"
                    data:
                      brightness_pct: >-
                        {% set pct = (start_bri | int) / 255 * 100 %}
                        {% set sign = 1 if going_up | int == 1 else -1 %}
                        {% set nxt = pct + sign * (wall_long_step | float) %}
                        {% if sign == 1 %}
                          {{ [100, [nxt, brightness_min_pct | float] | max] | min }}
                        {% else %}
                          {{ [nxt, brightness_min_pct | float] | max }}
                        {% endif %}
                      transition: "{{ brightness_transition }}"

              # Ramp while long_push is still the event_type, or while the hold sensor is on.
              - conditions:
                  - condition: template
                    value_template: "{{ ramp_mode in ['event', 'sensor'] }}"
                sequence:
                  - repeat:
                      while: >-
                        {% set at_cap = (going_up | int == 1 and (ramp_level | int) >= 255)
                           or (going_up | int == 0 and (ramp_level | int) <= (min_brightness | int)) %}
                        {% set max_steps = [1, (30 / (wall_dim_interval | float(0.2))) | round(0) | int] | max %}
                        {% set event_held = state_attr(held_entity, 'event_type') in wall_held_types %}
                        {% set holds = [wall_hold] if wall_hold is string else wall_hold %}
                        {% set sensor_held = holds | select('is_state', 'on') | list | length > 0 %}
                        {{ (not at_cap)
                           and repeat.index <= max_steps
                           and ((ramp_mode == 'event' and event_held)
                                or (ramp_mode == 'sensor' and sensor_held)) }}
                      sequence:
                        - variables:
                            ramp_level: >-
                              {% set step = (wall_dim_step | float) / 100 * 255 %}
                              {% set nxt = (ramp_level | int) + (step if going_up | int == 1 else -step) %}
                              {% if going_up | int == 1 %}
                                {{ [255, nxt] | min | round(0) | int }}
                              {% else %}
                                {{ [min_brightness | int, nxt] | max | round(0) | int }}
                              {% endif %}
                        - action: light.turn_on
                          target:
                            entity_id: "{{ wall_target }}"
                          data:
                            brightness: "{{ ramp_level | int }}"
                            transition: "{{ wall_dim_interval }}"
                        - delay:
                            seconds: "{{ wall_dim_interval }}"
